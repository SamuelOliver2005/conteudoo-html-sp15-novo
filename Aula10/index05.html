<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>DConteudo aula10 - HTML</title>
    </head>
<body>

    <h1>Definindo listas no HTML</h1>
    
    <h3>Exemplo de lista não ordenada</h3>

    <ul>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ul>

    <hr>

    <h3>Exemplo de lista ordenada</h3>

    <ol>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
    </ol>

</body>
</html>
